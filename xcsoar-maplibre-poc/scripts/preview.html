<!--
  Zero-dependency browser preview for a mapgen MapLibre bundle, using
  MapLibre GL JS (https://github.com/maplibre/maplibre-gl-js) from a CDN -
  no npm/build step needed.

  Usage:
    1. Unzip a .xcm built with --maplibre and copy this file next to
       style.json, e.g.:
         unzip -o chamonix_test.xcm -d /tmp/chamonix_unzipped
         cp preview.html /tmp/chamonix_unzipped/maplibre/
    2. Serve that directory over HTTP (browsers block XHR/fetch on
       file:// origins, and the bundle's style.json points at offline
       mbtiles:// URLs a plain static server can't resolve anyway):
         cd /tmp/chamonix_unzipped/maplibre && python3 -m http.server 8080
    3. Open http://localhost:8080/preview.html
       (optionally with ?lat=..&lon=..&zoom=.. to recenter - defaults
       below match the validated Chamonix test bundle)

  This page fetches the bundle's real style.json as-is and only rewrites
  each mbtiles://./<name>.mbtiles source to the flat
  tiles/<name>/{z}/{x}/{y}.<ext> preview tree mapgen builds alongside it
  (see maplibre.py's __unpack_flat_tiles()) - everything else (layers,
  paint, sprite, glyphs) is exactly what XCSoar would ship.

  The panel on the right is a debugging aid: it shows, for whatever tile
  is under the mouse, the tile's z/x/y, the cursor's pixel offset within
  that tile, and - for the hillshade raster-dem source - the actual
  decoded elevation at that exact pixel, read directly from the flat PNG
  tile file (bypassing MapLibre's GPU decode/shader entirely). That last
  part is the important bit for debugging rendering artifacts: it tells
  you whether something odd is already present in the source data mapgen
  generated, or only appears once MapLibre decodes/shades it.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>mapgen MapLibre bundle preview</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #error {
      position: absolute; top: 1em; left: 1em; right: 1em; z-index: 2;
      font: 14px/1.4 sans-serif; background: #fff3f3; color: #900;
      border: 1px solid #900; border-radius: 4px; padding: 0.75em 1em;
      display: none;
    }
    #debug {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 1;
      width: 320px; overflow-y: auto; box-sizing: border-box;
      padding: 0.75em 0.9em; background: rgba(20, 20, 24, 0.85); color: #d8d8d8;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none; white-space: pre-wrap;
      display: flex; flex-direction: column; justify-content: center;
    }
    #debug h1 {
      font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: #8ab4f8; margin: 0.9em 0 0.25em; border-top: 1px solid #444; padding-top: 0.6em;
    }
    #debug h1:first-child { margin-top: 0; border-top: none; padding-top: 0; }
    #debug .row { display: flex; justify-content: space-between; gap: 1em; }
    #debug .row span:first-child { color: #999; }
    #debug .swatch {
      display: inline-block; width: 10px; height: 10px; margin-right: 0.4em;
      vertical-align: middle; border: 1px solid #666;
    }
    #debug .warn { color: #f28b82; }
    #debug .muted { color: #777; }
  </style>
</head>
<body>
  <div id="error"></div>
  <div id="map"></div>
  <div id="debug"><div class="muted">Move the mouse over the map…</div></div>
  <script>
    const params = new URLSearchParams(location.search);
    const center = [
      parseFloat(params.get("lon")) || 6.87,
      parseFloat(params.get("lat")) || 45.92,
    ];
    const zoom = parseFloat(params.get("zoom")) || 11;

    // ---- tile-math helpers (standard slippy-map XYZ grid) ----

    function lngLatToTileFrac(lng, lat, z) {
      const n = Math.pow(2, z);
      const x = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const y = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      return [x, y];
    }

    // ---- per-source tile-image cache, for reading raw pixel bytes ----
    // Keyed by "z/x/y" -> { canvas, ctx } | "error" | Promise (while loading)

    class RasterTileReader {
      constructor(urlTemplate, tileSize) {
        this.urlTemplate = urlTemplate;
        this.tileSize = tileSize || 256;
        this.cache = new Map();
      }

      urlFor(z, x, y) {
        return this.urlTemplate
          .replace("{z}", z).replace("{x}", x).replace("{y}", y);
      }

      // Returns { canvas, ctx } synchronously if already cached, else null
      // (and kicks off a fetch in the background so a later call succeeds).
      get(z, x, y) {
        const key = z + "/" + x + "/" + y;
        const cached = this.cache.get(key);
        if (cached && cached !== "loading" && cached !== "error") return cached;
        if (!cached) {
          this.cache.set(key, "loading");
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            this.cache.set(key, { canvas, ctx, width: img.width, height: img.height });
          };
          img.onerror = () => this.cache.set(key, "error");
          img.src = this.urlFor(z, x, y);
        }
        return null;
      }

      // Returns [r, g, b, a] or null if the tile isn't loaded (yet, or 404).
      pixelAt(z, x, y, px, py) {
        const tile = this.get(z, x, y);
        if (!tile) return null;
        px = Math.max(0, Math.min(tile.width - 1, px));
        py = Math.max(0, Math.min(tile.height - 1, py));
        return tile.ctx.getImageData(px, py, 1, 1).data;
      }
    }

    function decodeTerrainRgb(r, g, b) {
      return -10000 + (r * 65536 + g * 256 + b) * 0.1;
    }

    function fmt(n, digits) {
      return typeof n === "number" ? n.toFixed(digits === undefined ? 1 : digits) : "?";
    }

    fetch("style.json")
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status + " fetching style.json");
        return r.json();
      })
      .then((style) => {
        // Track raster (raster-dem / raster) sources so the debug panel
        // can read their tiles directly - separate from whatever
        // MapLibre itself decides to fetch/render.
        const rasterSources = {}; // name -> { reader, maxzoom, minzoom, encoding, type }

        for (const [name, source] of Object.entries(style.sources || {})) {
          const match = /mbtiles:\/\/\.\/([^/]+)\.mbtiles$/.exec(source.url || "");
          if (!match) continue;
          const mbtilesName = match[1]; // e.g. "basemap" or "hillshade"
          const ext = source.type === "raster-dem" ? "png" : "pbf";
          delete source.url;
          const tileUrl = "tiles/" + mbtilesName + "/{z}/{x}/{y}." + ext;
          source.tiles = [tileUrl];

          if (source.type === "raster-dem" || source.type === "raster") {
            rasterSources[name] = {
              reader: new RasterTileReader(tileUrl, source.tileSize || 256),
              maxzoom: source.maxzoom,
              minzoom: source.minzoom || 0,
              encoding: source.encoding || "mapbox", // MapLibre's raster-dem default
              type: source.type,
            };
          }
        }

        const map = new maplibregl.Map({ container: "map", style, center, zoom });
        map.addControl(new maplibregl.NavigationControl());
        map.addControl(new maplibregl.ScaleControl());

        const debugEl = document.getElementById("debug");

        function renderDebugPanel(e) {
          const lng = e.lngLat.lng, lat = e.lngLat.lat;
          const mapZoom = map.getZoom();
          const pieces = [];

          pieces.push(
            '<h1>Cursor</h1>' +
            '<div class="row"><span>lng, lat</span><span>' +
              fmt(lng, 6) + ", " + fmt(lat, 6) + '</span></div>' +
            '<div class="row"><span>map zoom</span><span>' + fmt(mapZoom, 3) + '</span></div>' +
            '<div class="row"><span>canvas px</span><span>' +
              Math.round(e.point.x) + ", " + Math.round(e.point.y) + '</span></div>'
          );

          for (const [name, info] of Object.entries(rasterSources)) {
            // MapLibre requests tiles at floor(mapZoom), clamped to the
            // source's [minzoom, maxzoom] - zoom levels beyond maxzoom
            // reuse (overzoom) the deepest tile, so the *tile* z is
            // clamped but the pixel-within-tile offset is still computed
            // at full precision, which correctly lands on the same
            // source pixel a GPU overzoom would show.
            const maxz = info.maxzoom !== undefined ? info.maxzoom : 22;
            const tileZ = Math.max(info.minzoom, Math.min(maxz, Math.floor(mapZoom)));
            const [xf, yf] = lngLatToTileFrac(lng, lat, tileZ);
            const tileX = Math.floor(xf);
            const tileY = Math.floor(yf);
            const tileSize = info.reader.tileSize;
            const px = Math.floor((xf - tileX) * tileSize);
            const py = Math.floor((yf - tileY) * tileSize);

            pieces.push('<h1>Source: ' + name + ' (' + info.type + ')</h1>');
            pieces.push(
              '<div class="row"><span>tile z/x/y</span><span>' +
                tileZ + " / " + tileX + " / " + tileY + '</span></div>' +
              '<div class="row"><span>px within tile</span><span>' +
                px + ", " + py + ' / ' + tileSize + '</span></div>' +
              (mapZoom > maxz
                ? '<div class="row warn"><span>overzoomed</span><span>+' +
                  fmt(mapZoom - maxz, 2) + ' zoom</span></div>'
                : '')
            );

            const rgba = info.reader.pixelAt(tileZ, tileX, tileY, px, py);
            if (!rgba) {
              pieces.push('<div class="muted">(tile not loaded yet)</div>');
              continue;
            }
            const [r, g, b, a] = rgba;
            pieces.push(
              '<div class="row"><span>' +
                '<span class="swatch" style="background: rgb(' + r + ',' + g + ',' + b + ')"></span>' +
                'raw RGBA</span><span>' + r + ", " + g + ", " + b + ", " + a + '</span></div>'
            );

            if (info.type === "raster-dem") {
              const elev = decodeTerrainRgb(r, g, b);
              pieces.push(
                '<div class="row"><span>elevation</span><span>' + fmt(elev, 2) + ' m</span></div>'
              );

              // Neighbor deltas, when they land in the same already-loaded
              // tile - a quick way to spot single-pixel spikes/steps by
              // eye while hovering, without leaving the browser.
              const deltas = [];
              const neighbors = [
                ["→", px + 1, py], ["←", px - 1, py],
                ["↓", px, py + 1], ["↑", px, py - 1],
              ];
              for (const [arrow, nx, ny] of neighbors) {
                if (nx < 0 || ny < 0 || nx >= tileSize || ny >= tileSize) continue;
                const nrgba = info.reader.pixelAt(tileZ, tileX, tileY, nx, ny);
                if (!nrgba) continue;
                const nElev = decodeTerrainRgb(nrgba[0], nrgba[1], nrgba[2]);
                deltas.push(arrow + " " + (nElev - elev >= 0 ? "+" : "") + fmt(nElev - elev, 2));
              }
              if (deltas.length) {
                pieces.push('<div class="row"><span>Δ neighbors (m)</span><span>' +
                  deltas.join("  ") + '</span></div>');
              }
            }
          }

          debugEl.innerHTML = pieces.join("");
        }

        map.on("mousemove", (e) => {
          renderDebugPanel(e);
        });
        // Tiles keep streaming in after the mouse stops moving; refresh
        // the panel on load/zoom so it doesn't get stuck showing
        // "(tile not loaded yet)" once the data is actually available.
        map.on("data", (e) => {
          if (e.dataType === "source" && map.__lastMouseEvent) {
            renderDebugPanel(map.__lastMouseEvent);
          }
        });
        map.on("mousemove", (e) => { map.__lastMouseEvent = e; });
        map.on("zoomend", () => {
          if (map.__lastMouseEvent) renderDebugPanel(map.__lastMouseEvent);
        });
      })
      .catch((err) => {
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent =
          "Could not load the bundle: " + err.message +
          " - serve this page from inside the unzipped maplibre/ folder" +
          " (next to style.json), e.g. `python3 -m http.server 8080`.";
      });
  </script>
</body>
</html>
