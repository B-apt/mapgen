version: '3'
services:
  mapgen-frontend:
    build:
      context: .
      dockerfile: ./container/frontend/Dockerfile
      # Docker's predefined proxy build args: empty here by default
      # no-op for a normal deployment, Set the values in a local .env file.
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ghcr.io/xcsoar/mapgen-frontend
    ports:
      - "9090:9090"
    environment:
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-}
    volumes:
      - mapgen-jobs:/opt/mapgen/jobs

  mapgen-worker:
    build:
      context: .
      dockerfile: ./container/worker/Dockerfile
      # Docker's predefined proxy build args: empty here by default
      # no-op for a normal deployment, Set the values in a local .env file.
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ghcr.io/xcsoar/mapgen-worker
    # Empty by default, so this is a no-op
    # on a normal deployment: set the values in a local .env file or export 
    # them before `docker compose up`
    environment:
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-}
    volumes:
      - mapgen-jobs:/opt/mapgen/jobs
      - mapgen-data:/opt/mapgen/data

volumes:
  mapgen-data:
  mapgen-jobs: